name: Update recovery catalog

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-recovery-catalog
  cancel-in-progress: true

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate catalog
        run: node scripts/generate-recovery-catalog.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/recovery-catalog.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update recovery catalog"
            git push
          fi
