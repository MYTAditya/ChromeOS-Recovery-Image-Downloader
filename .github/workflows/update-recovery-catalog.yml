name: Update recovery catalog
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-recovery-catalog
  cancel-in-progress: true
jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate catalog
        run: node scripts/generate-recovery-catalog.mjs
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update recovery catalog"
          title: "chore: update recovery catalog"
          body: Automated update of the ChromeOS recovery catalog.
          branch: bot/update-recovery-catalog
          delete-branch: true
          add-paths: public/catalog/recovery-catalog.json
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
