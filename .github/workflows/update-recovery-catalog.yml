name: Update recovery catalog
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-recovery-catalog
  cancel-in-progress: true
jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_BYPASS_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate catalog
        run: node generate-recovery-catalog.mjs

      - name: Commit and push directly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/recovery-catalog.json
          git diff --staged --quiet || (git commit -m "chore: update recovery catalog" && git push)
